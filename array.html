<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARRAY</title>
</head>

<body>
    <h1>Array</h1>
    <h2>array is used to store multiple data in single  varaiables of same data type </h2>
    <h3 class="hi"></h3>
    <h3 class="hi"></h3>
    <h3 class="hi"></h3>
    <h3 class="hi"></h3>
    <h3 class="hi"></h3>

    <script>
        const student_name=[];
        student_name[0] = "nive";
        student_name[1] = "diya";
        student_name[2] = "priya";
        student_name[3] = "ram";
        student_name[4] = "prani";
        
        document.getElementsByClassName("hi")[0].innerHTML=student_name;

        const marks=[50,60,70,80,90];
        
        document.getElementsByClassName("hi")[0].innerHTML=marks;
        
        document.getElementsByClassName("hi")[2].innerHTML=student_name[0];

        const courses = new Array("Python","React.js","Django","Javascript");
        document.getElementsByClassName("hi")[3].innerHTML=courses;



        //for each loop


        student_name.forEach(
            (val,index)=>{
                document.write(`${index} : ${val} </br>`)
            }
        )
        document.write("--------------------</br>")

         courses.map((course, index) => {
            document.write(`${index} : ${course} </br>`)
            })
            

            // Strings in array
        let name = "Javascript";
        let l = " Programming Language";
    document.write("------------------------------- </br>") 
        document.write(name,"</br>")
        document.write(name.toUpperCase() ,"</br>")
        document.write(name.toLowerCase() ,"</br>")
        document.write(name.charAt(3) ,"</br>")
        document.write(name.concat(l) ,"</br>")
        document.write(name.endsWith("pt") ,"</br>")
        document.write(name.startsWith("Java") ,"</br>")
        document.write(name.includes("script") ,"</br>")
        document.write(name.indexOf("a") ,"</br>")
        document.write(name.length,"</br>")




         










    </script>

    
</body>
</html>
